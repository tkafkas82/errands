name: errands

services:
  db:
    image: mariadb:11
    container_name: errands-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    container_name: errands-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      # WP_DEBUG is defined by the image from this var; do not redefine it in CONFIG_EXTRA.
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('FS_METHOD', 'direct');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_MEMORY_LIMIT', '512M');
        define('DISALLOW_FILE_EDIT', false);
        define('AUTOMATIC_UPDATER_DISABLED', true);
    volumes:
      - wp_core:/var/www/html
      # Theme and media live on the Windows side so they can be edited/browsed directly.
      - ./wp-content/themes/errands:/var/www/html/wp-content/themes/errands
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  # One-shot helper: `docker compose run --rm cli wp <command>`
  cli:
    image: wordpress:cli-php8.3
    container_name: errands-cli
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/errands:/var/www/html/wp-content/themes/errands
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./import:/import
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  db_data:
  wp_core:
